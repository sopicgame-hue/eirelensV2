# Publie automatiquement le jeu sur GitHub Pages à chaque push sur la branche main.
# Activation (une seule fois) : GitHub → dépôt → Settings → Pages → Source : "GitHub Actions".
# URL obtenue : https://<ton-compte>.github.io/<nom-du-depot>/
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
        env:
          # Le site est servi sous /<nom-du-depot>/ : on l'indique à Vite
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
